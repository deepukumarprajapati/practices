  <body>
    <script>
      const nums = [-2, 5, 8, 2, 15, 1];

      const findMax = (items) => {
        let result = 0;
        for (item of items) {
          if (item > result) {
            result = item;
          }
        }
        return result;
      };

      console.log(findMax(nums));
    </script>
  </body>
</html>
