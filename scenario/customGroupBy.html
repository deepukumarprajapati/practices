    <script>
      const users = [

      function groupBy(userData) {
        let obj = {};
        for (user of userData) {
          if (!(user.city in obj)) {
            obj[user.city] = [];
          }
          obj[user.city].push(user);
        }
        return obj;
      }

      console.log(groupBy(users));
