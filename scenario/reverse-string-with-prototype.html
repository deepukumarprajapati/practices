      if (!String.prototype.toCustomReverse) {
        String.prototype.toCustomReverse = function () {
          let str = "";
          for (let i = this.length - 1; i >= 0; i--) {
            str += this[i];
          }

          return str;
        };
      }

      console.log(text.toCustomReverse());
    </script>
